<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- These two lines make it run full-screen like an app when added to the iPad Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Match Forever</title>
<style>
  :root{
    --bg:#EFF6FF;          /* pale sky */
    --ink:#2B3A55;         /* soft navy outline */
    --coral:#FF6B6B;
    --sunny:#FFC53D;
    --leaf:#51C878;
    --ocean:#4D96FF;
    --grape:#A78BFA;
    --card:#FFFFFF;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    overflow:hidden;
    /* touch-action none = the page never scrolls or zooms while little fingers drag */
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Comic Sans MS", "Segoe UI", sans-serif;
    background:var(--bg);
  }
  #game{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    padding:max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
  }

  /* ---------- top bar: stars + easy-mode toggle ---------- */
  #topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 10px;
  }
  #stars{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border-radius:999px;
    padding:6px 16px;
    font-size:clamp(20px, 3.5vmin, 30px); font-weight:800; color:var(--ink);
    box-shadow:0 3px 0 rgba(43,58,85,.12);
  }
  #modeBtn{
    border:none; background:var(--card); color:var(--ink);
    font:inherit; font-size:clamp(13px, 2.2vmin, 17px); font-weight:700;
    border-radius:999px; padding:8px 14px;
    box-shadow:0 3px 0 rgba(43,58,85,.12);
    cursor:pointer;
  }
  #modeBtn:active{ transform:translateY(2px); box-shadow:none; }
  #modeBtn:focus-visible{ outline:3px solid var(--ocean); outline-offset:2px; }

  /* ---------- targets ---------- */
  #targets{
    flex:1;
    display:flex; flex-wrap:wrap; align-items:center; align-content:center;
    justify-content:center;
    gap:clamp(10px, 2.5vw, 32px);
    max-width:900px; margin:0 auto;
  }
  .target{
    width:clamp(90px, 19vmin, 180px);
    height:clamp(90px, 19vmin, 180px);
    background:var(--card);
    border-radius:28px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 5px 0 rgba(43,58,85,.12);
    transition:transform .15s ease;
  }
  .target svg{ width:72%; height:72%; }
  .target.glow{ transform:scale(1.08); }
  .target.win{ animation:targetPop .45s ease; }
  @keyframes targetPop{
    0%{ transform:scale(1); } 40%{ transform:scale(1.18); } 100%{ transform:scale(1); }
  }

  /* ---------- the draggable piece ---------- */
  #homeSlot{
    height:clamp(130px, 28vmin, 240px);
    display:flex; align-items:center; justify-content:center;
  }
  #piece{
    position:fixed; /* positioned in JS so it can follow the finger anywhere */
    width:clamp(100px, 22vmin, 200px);
    height:clamp(100px, 22vmin, 200px);
    left:0; top:0;
    will-change:transform;
    filter:drop-shadow(0 6px 0 rgba(43,58,85,.15));
    z-index:5;
  }
  #piece svg{ width:100%; height:100%; }
  #piece.snapback{ transition:transform .35s cubic-bezier(.34,1.56,.64,1); }
  #piece.wobble{ animation:wobble .4s ease; }
  @keyframes wobble{
    0%,100%{ rotate:0deg; } 25%{ rotate:-8deg; } 75%{ rotate:8deg; }
  }
  /* blinking eyes on the piece — the game's one bit of personality */
  .eye{ animation:blink 4s infinite; transform-origin:center; }
  @keyframes blink{
    0%, 92%, 100%{ transform:scaleY(1); }
    95%{ transform:scaleY(.08); }
  }

  /* ---------- confetti stars ---------- */
  .confetti{
    position:fixed; width:22px; height:22px; z-index:9;
    pointer-events:none; font-size:22px; line-height:1;
  }

  @media (prefers-reduced-motion: reduce){
    .eye, .target.win, #piece.wobble{ animation:none; }
    #piece.snapback{ transition:none; }
    .confetti{ display:none; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="topbar">
    <div id="stars">⭐ <span id="starCount">0</span></div>
    <button id="modeBtn" aria-label="Switch difficulty">6 buckets</button>
  </div>
  <div id="targets"></div>
  <div id="homeSlot"></div>
</div>
<div id="piece"></div>

<script>
"use strict";

/* ============================================================
   Match Forever — an endless toddler matching game.
   One piece appears at the bottom. Drag it onto the bucket
   with the same shape + color. Correct = pop + stars + a new
   piece. Wrong = gentle wobble home. It never ends.
   ============================================================ */

const COLORS = [
  { name:"coral", hex:"#FF6B6B" },
  { name:"sunny", hex:"#FFC53D" },
  { name:"leaf",  hex:"#51C878" },
  { name:"ocean", hex:"#4D96FF" },
  { name:"grape", hex:"#A78BFA" },
  { name:"teal",  hex:"#2CC5B6" },
];

/* Each shape is an SVG path drawn in a 100x100 box */
const SHAPES = {
  circle:  '<circle cx="50" cy="50" r="42" />',
  square:  '<rect x="10" y="10" width="80" height="80" rx="16" />',
  triangle:'<path d="M50 8 L94 88 Q50 100 6 88 Z" />',
  star:    '<path d="M50 4 L61 36 L95 37 L68 58 L78 92 L50 72 L22 92 L32 58 L5 37 L39 36 Z" />',
  heart:   '<path d="M50 90 C10 62 6 34 24 20 C38 10 50 22 50 30 C50 22 62 10 76 20 C94 34 90 62 50 90 Z" />',
  diamond: '<path d="M50 6 L90 50 L50 94 L10 50 Z" />',
};
const SHAPE_KEYS = Object.keys(SHAPES);

let targetCount = 6;      // toggles between 6 and 3 (easier)
let stars = 0;
let round = null;         // { answerIndex, options:[{shape,color}] }
let dragging = false;
let audioCtx = null;

const el = {
  targets:   document.getElementById("targets"),
  piece:     document.getElementById("piece"),
  homeSlot:  document.getElementById("homeSlot"),
  starCount: document.getElementById("starCount"),
  modeBtn:   document.getElementById("modeBtn"),
};

/* ---------- tiny sound engine (no audio files needed) ---------- */
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, start, dur, type="sine", vol=0.18){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, audioCtx.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(audioCtx.currentTime + start);
  o.stop(audioCtx.currentTime + start + dur + 0.05);
}
function soundCorrect(){ tone(523,0,.15); tone(784,.12,.22); }
function soundWrong(){ tone(196,0,.25,"triangle",.10); }
function soundFanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f, i*0.12, .3)); }

/* ---------- building SVG for a shape+color ---------- */
function shapeSVG(shapeKey, colorHex, withFace){
  const face = withFace ? `
    <g fill="#2B3A55">
      <ellipse class="eye" cx="38" cy="48" rx="5" ry="7"/>
      <ellipse class="eye" cx="62" cy="48" rx="5" ry="7"/>
      <path d="M40 62 Q50 70 60 62" stroke="#2B3A55" stroke-width="4"
            fill="none" stroke-linecap="round"/>
    </g>` : "";
  return `<svg viewBox="0 0 100 100">
    <g fill="${colorHex}" stroke="#2B3A55" stroke-width="4" stroke-linejoin="round">
      ${SHAPES[shapeKey]}
    </g>${face}</svg>`;
}

/* ---------- round setup ---------- */
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function newRound(){
  // pick N distinct shape+color combos; both cues differ so either one works
  const shapePick = shuffle([...SHAPE_KEYS]).slice(0, targetCount);
  const colorPick = shuffle([...COLORS]).slice(0, targetCount);
  const options = shapePick.map((s,i)=>({ shape:s, color:colorPick[i] }));
  const answerIndex = Math.floor(Math.random() * targetCount);
  round = { answerIndex, options };

  // draw targets
  el.targets.innerHTML = "";
  options.forEach((opt, i)=>{
    const t = document.createElement("div");
    t.className = "target";
    t.dataset.index = i;
    t.innerHTML = shapeSVG(opt.shape, opt.color.hex, false);
    el.targets.appendChild(t);
  });

  // draw the piece and park it at home
  const ans = options[answerIndex];
  el.piece.innerHTML = shapeSVG(ans.shape, ans.color.hex, true);
  placePieceAtHome(false);
}

function homeCenter(){
  const r = el.homeSlot.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

function setPieceCenter(x, y){
  const w = el.piece.offsetWidth, h = el.piece.offsetHeight;
  el.piece.style.transform = `translate(${x - w/2}px, ${y - h/2}px)`;
}

function placePieceAtHome(animate){
  if(animate) el.piece.classList.add("snapback");
  const c = homeCenter();
  setPieceCenter(c.x, c.y);
  if(animate) setTimeout(()=>el.piece.classList.remove("snapback"), 380);
}

/* ---------- drag handling (pointer events = mouse + touch) ---------- */
el.piece.addEventListener("pointerdown", (e)=>{
  ensureAudio();               // audio must start from a user gesture on iOS
  dragging = true;
  el.piece.setPointerCapture(e.pointerId);
  el.piece.classList.remove("snapback");
  setPieceCenter(e.clientX, e.clientY);
});

el.piece.addEventListener("pointermove", (e)=>{
  if(!dragging) return;
  setPieceCenter(e.clientX, e.clientY);
  highlightNearest(e.clientX, e.clientY);
});

el.piece.addEventListener("pointerup", (e)=>{
  if(!dragging) return;
  dragging = false;
  clearGlow();
  const hit = targetUnder(e.clientX, e.clientY);
  if(hit === null){ placePieceAtHome(true); return; }
  if(hit === round.answerIndex) win(hit);
  else miss();
});
el.piece.addEventListener("pointercancel", ()=>{
  dragging = false; clearGlow(); placePieceAtHome(true);
});

function targetUnder(x, y){
  const nodes = el.targets.children;
  for(const n of nodes){
    const r = n.getBoundingClientRect();
    // generous hit box: 25% padding around each bucket for small fingers
    const pad = r.width * 0.25;
    if(x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad){
      return Number(n.dataset.index);
    }
  }
  return null;
}
function highlightNearest(x, y){
  clearGlow();
  const i = targetUnder(x, y);
  if(i !== null) el.targets.children[i].classList.add("glow");
}
function clearGlow(){
  [...el.targets.children].forEach(t=>t.classList.remove("glow"));
}

/* ---------- outcomes ---------- */
function win(index){
  const t = el.targets.children[index];
  const r = t.getBoundingClientRect();
  el.piece.classList.add("snapback");
  setPieceCenter(r.left + r.width/2, r.top + r.height/2);
  t.classList.add("win");
  soundCorrect();
  stars++;
  el.starCount.textContent = stars;
  confetti(r.left + r.width/2, r.top + r.height/2);
  if(stars % 10 === 0) soundFanfare();
  // the forever loop: a fresh round spawns right after the celebration
  setTimeout(()=>{
    el.piece.classList.remove("snapback");
    newRound();
  }, 650);
}

function miss(){
  soundWrong();
  el.piece.classList.add("wobble");
  placePieceAtHome(true);
  setTimeout(()=>el.piece.classList.remove("wobble"), 420);
}

function confetti(x, y){
  const glyphs = ["⭐","✨","🌟"];
  for(let i = 0; i < 8; i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.textContent = glyphs[i % glyphs.length];
    c.style.left = (x - 11) + "px";
    c.style.top  = (y - 11) + "px";
    document.body.appendChild(c);
    const ang = (Math.PI * 2 * i) / 8;
    const dist = 70 + Math.random() * 60;
    c.animate([
      { transform:"translate(0,0) scale(1)", opacity:1 },
      { transform:`translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist - 30}px) scale(.3)`, opacity:0 }
    ], { duration:700, easing:"ease-out" }).onfinish = ()=>c.remove();
  }
}

/* ---------- easy-mode toggle (for the adult) ---------- */
el.modeBtn.addEventListener("click", ()=>{
  targetCount = targetCount === 6 ? 3 : 6;
  el.modeBtn.textContent = targetCount + " buckets";
  newRound();
});

/* keep the piece parked correctly if the iPad rotates */
window.addEventListener("resize", ()=>{ if(!dragging) placePieceAtHome(false); });

newRound();
</script>
</body>
</html>
